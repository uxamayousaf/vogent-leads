name: Find Leads

on:
  schedule:
    - cron: "7 1 * * *"    # 6:07 AM Pakistan time (main run)
    - cron: "7 4 * * *"    # 9:07 AM Pakistan time (backup, in case the first is delayed)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        category: ["CRM Automation", "AI Automation", "RevOps", "Bookkeeping",
                   "Performance Marketing", "Virtual Assistant", "Customer Service"]
        region: ["USA / Canada", "UK / Europe / EMEA", "Gulf", "Australia / NZ", "Asia (English)"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install python-jobspy requests langdetect
      - run: python find_leads.py
        env:
          CATEGORY: ${{ matrix.category }}
          REGION: ${{ matrix.region }}
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
