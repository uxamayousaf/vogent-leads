name: Find Leads

on:
  # Started every morning by the Google Sheet (exact time, see startDailyRun in Apps Script)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

jobs:
  # ---------- Phase 1: job search ----------
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5        # fewer searches at once, so LinkedIn does not rate-limit us
      matrix:
        category: ["CRM Automation", "AI Automation", "Email Marketing", "Performance Marketing", "Lead Generation",
                   "SEO", "Website Support", "Design & Video", "Virtual Assistant", "Customer Service",
                   "Bookkeeping", "Social Media", "Content Writing", "General Remote", "Worldwide Hiring",
                   "Tech Web & Mobile", "Tech AI & Data", "SimplyHired GHL"]
        region: ["USA", "Canada", "UK"]
        exclude:                 # SimplyHired is USA only
          - category: "SimplyHired GHL"
            region: "Canada"
          - category: "SimplyHired GHL"
            region: "UK"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools (tries again if the download drops)
        run: |
          for i in 1 2 3 4 5; do
            pip install --retries 5 --timeout 60 python-jobspy requests langdetect && exit 0
            echo "Install failed, trying again in 20 seconds ($i of 5)"; sleep 20
          done
          exit 1
      - run: python find_leads.py
        env:
          CATEGORY: ${{ matrix.category }}
          REGION: ${{ matrix.region }}
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}      # used only by the SimplyHired search
      - uses: actions/upload-artifact@v4
        with:
          name: candidates-${{ strategy.job-index }}
          path: candidates/
          if-no-files-found: ignore
          retention-days: 2

  # ---------- Phase 2, Step A: daily outreach queue ----------
  outreach:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools (tries again if the download drops)
        run: |
          for i in 1 2 3 4 5; do
            pip install --retries 5 --timeout 60 requests && exit 0
            echo "Install failed, trying again in 20 seconds ($i of 5)"; sleep 20
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: candidates-*
          path: candidates
          merge-multiple: true
      - run: python outreach.py
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}            # her account: AI drafting (free tier)
          HEYREACH_API_KEY: ${{ secrets.HEYREACH_API_KEY }}        # her account: adding this switches her account on
          HEYREACH_CAMPAIGN_ID: ${{ secrets.HEYREACH_CAMPAIGN_ID }}
          HEYREACH_ACCOUNT_ID: ${{ secrets.HEYREACH_ACCOUNT_ID }}
