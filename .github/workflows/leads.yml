name: Find Leads

on:
  # Started every morning by the Google Sheet (exact time, see startDailyRun in Apps Script)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs
    inputs:
      only_region:
        description: "Leave empty for the full run. Type one region (for example Sweden) to run only that region."
        required: false
        default: ""

jobs:
  # ---------- Phase 1: job search ----------
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10       # 10 searches at once (about 200 searches; the run starts at 3 AM Pakistan time)
      matrix:
        category: ["CRM Automation", "AI Automation", "Email Marketing", "Performance Marketing", "Lead Generation",
                   "SEO", "Website Support", "Design & Video", "Virtual Assistant", "Customer Service",
                   "Bookkeeping", "Social Media", "Content Writing", "General Remote", "Worldwide Hiring",
                   "Tech Web & Mobile", "Tech QA & DevOps", "Tech AI & Data", "SimplyHired GHL", "E-commerce Support",
                   "Video & Content", "No-Code & CRM Tech", "AI & Automation", "Remote Roles", "Design, Product & Delivery",
                   "Small Business Marketing", "Remote Boards"]
        region: ["USA", "Canada", "UK", "Australia", "New Zealand", "Ireland", "Singapore"]   # English-speaking markets: every search
        exclude:                 # SimplyHired and the remote job boards run once (USA job only)
          - category: "Remote Boards"
            region: "Canada"
          - category: "Remote Boards"
            region: "UK"
          - category: "Remote Boards"
            region: "Australia"
          - category: "Remote Boards"
            region: "New Zealand"
          - category: "Remote Boards"
            region: "Ireland"
          - category: "Remote Boards"
            region: "Singapore"
          - category: "SimplyHired GHL"
            region: "Canada"
          - category: "SimplyHired GHL"
            region: "UK"
          - category: "SimplyHired GHL"
            region: "Australia"
          - category: "SimplyHired GHL"
            region: "New Zealand"
          - category: "SimplyHired GHL"
            region: "Ireland"
          - category: "SimplyHired GHL"
            region: "Singapore"
        include:                 # Malaysia and Europe: tech, worldwide hiring and AI & Automation only
          - category: "Tech Web & Mobile"
            region: "Malaysia"
          - category: "Tech QA & DevOps"
            region: "Malaysia"
          - category: "Tech AI & Data"
            region: "Malaysia"
          - category: "Worldwide Hiring"
            region: "Malaysia"
          - category: "AI & Automation"
            region: "Malaysia"
          - category: "Tech Web & Mobile"
            region: "Netherlands"
          - category: "Tech QA & DevOps"
            region: "Netherlands"
          - category: "Tech AI & Data"
            region: "Netherlands"
          - category: "Worldwide Hiring"
            region: "Netherlands"
          - category: "AI & Automation"
            region: "Netherlands"
          - category: "Tech Web & Mobile"
            region: "Germany"
          - category: "Tech QA & DevOps"
            region: "Germany"
          - category: "Tech AI & Data"
            region: "Germany"
          - category: "Worldwide Hiring"
            region: "Germany"
          - category: "AI & Automation"
            region: "Germany"
          - category: "Tech Web & Mobile"
            region: "Sweden"
          - category: "Tech QA & DevOps"
            region: "Sweden"
          - category: "Tech AI & Data"
            region: "Sweden"
          - category: "Worldwide Hiring"
            region: "Sweden"
          - category: "AI & Automation"
            region: "Sweden"
          - category: "Tech Web & Mobile"
            region: "Denmark"
          - category: "Tech QA & DevOps"
            region: "Denmark"
          - category: "Tech AI & Data"
            region: "Denmark"
          - category: "Worldwide Hiring"
            region: "Denmark"
          - category: "AI & Automation"
            region: "Denmark"
          - category: "Sweden Tech"          # added 23 Nov: deep IT scan, Sweden only
            region: "Sweden"
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.only_region || matrix.region == inputs.only_region }}
      - uses: actions/setup-python@v5
        if: ${{ !inputs.only_region || matrix.region == inputs.only_region }}
        with:
          python-version: "3.11"
      - name: Install tools (tries again if the download drops)
        if: ${{ !inputs.only_region || matrix.region == inputs.only_region }}
        run: |
          for i in 1 2 3 4 5; do
            pip install --retries 5 --timeout 60 python-jobspy requests langdetect && exit 0
            echo "Install failed, trying again in 20 seconds ($i of 5)"; sleep 20
          done
          exit 1
      - run: python find_leads.py
        if: ${{ !inputs.only_region || matrix.region == inputs.only_region }}
        env:
          CATEGORY: ${{ matrix.category }}
          REGION: ${{ matrix.region }}
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}      # used only by the SimplyHired search
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.only_region || matrix.region == inputs.only_region }}
        with:
          name: candidates-${{ strategy.job-index }}
          path: candidates/
          if-no-files-found: ignore
          retention-days: 2

  # ---------- Phase 2, Step A: daily outreach queue ----------
  outreach:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools (tries again if the download drops)
        run: |
          for i in 1 2 3 4 5; do
            pip install --retries 5 --timeout 60 requests && exit 0
            echo "Install failed, trying again in 20 seconds ($i of 5)"; sleep 20
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: candidates-*
          path: candidates
          merge-multiple: true
      - run: python outreach.py
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}            # her account: AI drafting (free tier)
          HEYREACH_API_KEY: ${{ secrets.HEYREACH_API_KEY }}        # her account: adding this switches her account on
          HEYREACH_CAMPAIGN_ID: ${{ secrets.HEYREACH_CAMPAIGN_ID }}
          HEYREACH_ACCOUNT_ID: ${{ secrets.HEYREACH_ACCOUNT_ID }}
