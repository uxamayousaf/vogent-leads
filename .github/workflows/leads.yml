name: Find Leads

on:
  schedule:
    - cron: "0 0,8,16 * * *"   # about 5 AM, 1 PM, 9 PM Pakistan time
  workflow_dispatch:            # adds a "Run workflow" button for manual runs

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        category: ["GHL / CRM", "Performance Marketing", "Virtual Assistant", "Customer Service"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install python-jobspy requests
      - run: python find_leads.py
        env:
          CATEGORY: ${{ matrix.category }}
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
